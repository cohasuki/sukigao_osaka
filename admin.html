<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>名前登録</title>

<style>
body {
  margin: 0;
  padding: 20px;
  font-family: sans-serif;
  background: #fff7fb;
  color: #444;
}

h1 {
  text-align: center;
  color: #d86b9c;
}

#list {
  max-width: 700px;
  margin: auto;
}

.item {
  display: flex;
  align-items: center;
  gap: 10px;
  background: white;
  margin: 8px 0;
  padding: 8px;
  border-radius: 12px;
}

.item img {
  width: 70px;
  height: 70px;
  object-fit: cover;
  border-radius: 10px;
}

.item input {
  flex: 1;
  padding: 10px;
  border: 1px solid #ddd;
  border-radius: 8px;
  font-size: 16px;
}

button {
  display: block;
  margin: 20px auto;
  padding: 13px 25px;
  border: none;
  border-radius: 30px;
  background: #df78a5;
  color: white;
  font-size: 16px;
  font-weight: bold;
}

textarea {
  width: 100%;
  height: 300px;
  box-sizing: border-box;
  padding: 10px;
}
</style>
</head>

<body>

<h1>♡ 名前登録 ♡</h1>

<div id="loading">
  写真と名前を読み込んでいます…📸
</div>

<div id="list"></div>

<button onclick="makeNames()">
  名前データを作成♡
</button>

<textarea
  id="result"
  placeholder="ここに作成されたデータが表示されます"
></textarea>

<script>

const OWNER = "cohasuki";
const REPO = "sukigao_osaka";

let people = [];
let oldNames = {};

async function loadPhotos() {

  try {

    /* 写真一覧 */
    const photoUrl =
      `https://api.github.com/repos/${OWNER}/${REPO}/contents/`;

    const photoResponse = await fetch(photoUrl);
    const files = await photoResponse.json();

    people = files
      .filter(file => {

        const name = file.name.toLowerCase();

        return (
          name.endsWith(".jpg") ||
          name.endsWith(".jpeg") ||
          name.endsWith(".png") ||
          name.endsWith(".webp")
        );

      })
      .sort((a, b) =>
        a.name.localeCompare(b.name)
      );


    /* 今までの名前データ */
    try {

      const namesUrl =
        `https://cohasuki.github.io/sukigao_osaka/names.js`;

      const namesResponse = await fetch(namesUrl);
      const namesText = await namesResponse.text();

      /*
       * 新しい形式
       * const names = {
       *   "写真.jpg": "名前"
       * }
       */
      if (namesText.includes("const names = {")) {

        const match =
          namesText.match(/const names\s*=\s*(\{[\s\S]*\});/);

        if (match) {
          oldNames = Function(
            `"use strict"; return (${match[1]})`
          )();
        }

      }

      /*
       * 今までの形式
       * const names = [
       *   "名前1",
       *   "名前2"
       * ]
       *
       * 現在の写真順と対応させる
       */
      else {

        const match =
          namesText.match(/const names\s*=\s*(\[[\s\S]*\]);/);

        if (match) {

          const oldArray = Function(
            `"use strict"; return (${match[1]})`
          )();

          oldArray.forEach((name, index) => {

            if (people[index]) {
              oldNames[people[index].name] = name;
            }

          });

        }

      }

    } catch (error) {

      console.log("以前の名前データを読み込めませんでした", error);

    }


    const list = document.getElementById("list");

    document.getElementById("loading").remove();


    people.forEach((person, index) => {

      const item = document.createElement("div");

      item.className = "item";

      item.innerHTML = `
        <img src="${person.download_url}">

        <span>${index + 1}</span>

        <input
          type="text"
          class="personName"
          placeholder="名前"
          value="${oldNames[person.name] || ""}"
          data-filename="${person.name}"
        >
      `;

      list.appendChild(item);

    });

  } catch (error) {

    document.getElementById("loading").innerHTML =
      "写真の読み込みに失敗しました🥲<br>" +
      error.message;

  }

}


function makeNames() {

  const inputs =
    document.querySelectorAll(".personName");

  const names = {};

  inputs.forEach(input => {

    const filename =
      input.dataset.filename;

    const name =
      input.value.trim();

    names[filename] = name;

  });

  const code =
    `const names = ${JSON.stringify(names, null, 2)};`;

  document.getElementById("result").value = code;

}


loadPhotos();

</script>

</body>
</html>
