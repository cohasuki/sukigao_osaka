<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>好き顔大阪9選</title>

<style>
body {
  font-family: sans-serif;
  background: #fff0f6;
  margin: 0;
  padding: 20px;
  color: #555;
}

h1 {
  text-align: center;
  color: #d86b9c;
  margin-bottom: 10px;
}

h2 {
  text-align: center;
  color: #d86b9c;
}

button {
  border: none;
  border-radius: 20px;
  padding: 10px 20px;
  background: #f3a6c7;
  color: white;
  font-size: 16px;
  cursor: pointer;
}

button:hover {
  opacity: 0.8;
}

#start {
  display: block;
  margin: 30px auto;
}

.group {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  max-width: 700px;
  margin: 20px auto;
}

.card {
  background: white;
  border-radius: 15px;
  padding: 8px;
  text-align: center;
  cursor: pointer;
  border: 3px solid transparent;
  transition: 0.2s;
}

.card.selected {
  border-color: #f08ab5;
  background: #fff4f8;
}

.card img {
  width: 100%;
  aspect-ratio: 1 / 1;
  object-fit: cover;
  border-radius: 12px;
  display: block;
}

.name {
  margin-top: 6px;
  font-size: 13px;
  line-height: 1.3;
  word-break: break-word;
}

#nextButton,
#finishButton {
  display: block;
  margin: 20px auto;
}

#status {
  text-align: center;
  margin: 10px;
  font-weight: bold;
}

.matchup {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px;
  max-width: 700px;
  margin: 30px auto;
}

.match-card {
  background: white;
  border-radius: 20px;
  padding: 10px;
  text-align: center;
  cursor: pointer;
}

.match-card:hover {
  opacity: 0.85;
}

.match-card img {
  width: 100%;
  aspect-ratio: 1 / 1;
  object-fit: cover;
  border-radius: 15px;
}

.match-name {
  font-size: 16px;
  margin-top: 8px;
  font-weight: bold;
}

#progress {
  text-align: center;
  margin: 15px;
  color: #d86b9c;
  font-weight: bold;
}


/* =========================
   結果画面
========================= */

.rank {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  max-width: 700px;
  margin: auto;
  padding: 10px;
}

.rank-item {
  background: white;
  padding: 8px;
  border-radius: 15px;
  text-align: center;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.rank-item img {
  width: 100%;
  aspect-ratio: 1 / 1;
  object-fit: cover;
  border-radius: 12px;
  display: block;
  margin-bottom: 6px;
}

.rank-number {
  font-size: 20px;
  font-weight: bold;
  margin-bottom: 4px;
  color: #d86b9c;
}


/* 1位：金色 */
.rank-item.first-place .rank-number {
  color: #d4a017;
  font-size: 24px;
  text-shadow: 0 1px 2px rgba(0,0,0,0.1);
}


/* 2位：銀色 */
.rank-item.second-place .rank-number {
  color: #9fa4aa;
  font-size: 22px;
  text-shadow: 0 1px 2px rgba(0,0,0,0.1);
}


/* 3位：銅色 */
.rank-item.third-place .rank-number {
  color: #b87333;
  font-size: 22px;
  text-shadow: 0 1px 2px rgba(0,0,0,0.1);
}


.rank-name {
  font-size: 13px;
  line-height: 1.3;
  word-break: break-word;
}

.hidden {
  display: none;
}


@media (max-width: 500px) {

  body {
    padding: 10px;
  }

  .group {
    gap: 7px;
  }

  .name,
  .rank-name {
    font-size: 11px;
  }

  .rank-number {
    font-size: 17px;
  }

  .rank-item.first-place .rank-number {
    font-size: 21px;
  }

  .rank-item.second-place .rank-number,
  .rank-item.third-place .rank-number {
    font-size: 19px;
  }
}
</style>
</head>

<body>

<h1>💗 好き顔大阪9選 💗</h1>


<div id="loading">
  <p style="text-align:center;">読み込み中…</p>
</div>


<div id="startScreen" class="hidden">

  <p style="text-align:center;">
    好きな人を選んでください♡
  </p>

  <button id="start">
    スタート
  </button>

</div>


<div id="selectionScreen" class="hidden">

  <h2 id="roundTitle"></h2>

  <div id="status"></div>

  <div id="groups"></div>

  <button id="prevButton" class="hidden">
  前へ
</button>

<button id="nextButton">
  次へ
</button>

  <button id="finishButton" class="hidden">
    選択を終了する
  </button>

</div>


<div id="finalScreen" class="hidden">

  <h2>💗 最終決戦 💗</h2>

  <div id="progress"></div>

  <div id="matchup" class="matchup"></div>

</div>


<div id="resultScreen" class="hidden">

  <h2>🏆 あなたのタイプの顔大阪9選 🏆</h2>

  <button
    id="toggleRankButton"
    style="display:block;margin:15px auto;"
  >
    順位を隠す
  </button>

  <div id="ranking" class="rank"></div>
  <button
    onclick="location.reload()"
    style="display:block;margin:25px auto;"
  >
    もう一度やる
  </button>

  <p style="text-align:center;margin-top:35px;font-size:13px;color:#888;">
  ※アイドルさんの悲しむポストはお控えください
</p>

</div>


<script>

const OWNER = "cohasuki";
const REPO = "sukigao_osaka";

let names = {};
let people = [];

let currentPeople = [];
let selectedPeople = [];

let groups = [];
let currentGroupIndex = 0;

// 各グループで選択した人を保存
let groupSelections = [];

let finalPeople = [];
let matchups = [];
let currentMatchup = 0;

let wins = {};


/* =========================
   名前データ読み込み
========================= */

async function loadNames() {

  const url =
    `https://${OWNER}.github.io/${REPO}/names.js?v=${Date.now()}`;

  const response = await fetch(url, {
    cache: "no-store"
  });

  const text = await response.text();

  const match =
    text.match(/const\s+names\s*=\s*(\{[\s\S]*?\});/);

  if (!match) {
    throw new Error("names.jsの読み込みに失敗しました");
  }

  names = Function(
    `"use strict"; return (${match[1]});`
  )();
}


/* =========================
   写真読み込み
========================= */

async function loadPhotos() {

  const url =
    `https://api.github.com/repos/${OWNER}/${REPO}/contents/?v=${Date.now()}`;

  const response = await fetch(url, {
    cache: "no-store"
  });

  if (!response.ok) {
    throw new Error("GitHubから写真を取得できませんでした");
  }

  const files = await response.json();

  people = files
    .filter(file =>
      /\.(jpg|jpeg|png|webp)$/i.test(file.name)
    )
    .sort((a,b) =>
      a.name.localeCompare(b.name)
    )
    .map((file, index) => ({
      id: index,
      filename: file.name,
      url: file.download_url,
      name: names[file.name] || ""
    }));
}


/* =========================
   初期化
========================= */

async function init() {

  try {

    await loadNames();
    await loadPhotos();

    document.getElementById("loading")
      .classList.add("hidden");

    document.getElementById("startScreen")
      .classList.remove("hidden");

  } catch (error) {

    console.error(error);

    document.getElementById("loading").innerHTML =
      `<p style="text-align:center;color:red;">
        読み込みに失敗しました。<br>
        少し時間を置いて再読み込みしてください。
      </p>`;
  }
}


/* =========================
   スタート
========================= */

document.getElementById("start")
  .addEventListener("click", startSelection);


function startSelection() {

  currentPeople =
    [...people].sort(() => Math.random() - 0.5);

  selectedPeople = [];

  document.getElementById("startScreen")
    .classList.add("hidden");

  document.getElementById("selectionScreen")
    .classList.remove("hidden");

  showRound();
}


/* =========================
   予選ラウンド
========================= */

function showRound() {

  selectedPeople = [];

  currentGroupIndex = 0;

  groups = [];

  groupSelections = [];

  for (
    let i = 0;
    i < currentPeople.length;
    i += 9
  ) {

    groups.push(
      currentPeople.slice(i, i + 9)
    );

  }

  document.getElementById("roundTitle").textContent =
    `${currentPeople.length}人から選ぶ`;

  showGroup();

}


/* =========================
   グループ表示
========================= */

function showGroup() {

  const container =
    document.getElementById("groups");

  container.innerHTML = "";

  const group =
    groups[currentGroupIndex];

  const groupDiv =
    document.createElement("div");

  groupDiv.className = "group";


  // このグループで以前選択していた人
  const savedSelections =
    groupSelections[currentGroupIndex] || [];


  group.forEach(person => {

    const card =
      document.createElement("div");

    card.className = "card";

    // 以前選択していた人なら選択状態にする
    if (savedSelections.includes(person)) {
      card.classList.add("selected");
    }

    card.innerHTML = `
      <img src="${person.url}">
      <div class="name">
        ${person.name || "名前未登録"}
      </div>
    `;


    card.addEventListener("click", () => {

      if (selectedPeople.includes(person)) {

        selectedPeople =
          selectedPeople.filter(
            p => p !== person
          );

        card.classList.remove("selected");

      } else {

        selectedPeople.push(person);

        card.classList.add("selected");

      }

      // 現在のグループの選択状態を保存
      groupSelections[currentGroupIndex] =
        selectedPeople.filter(
          p => group.includes(p)
        );

      updateStatus();

    });


    groupDiv.appendChild(card);

  });


  container.appendChild(groupDiv);


  // 現在のグループの選択を復元
  selectedPeople = [
    ...selectedPeople.filter(
      p => !group.includes(p)
    ),
    ...savedSelections
  ];


  updateStatus();


  const isLast =
    currentGroupIndex === groups.length - 1;


  // 前へボタン
  document.getElementById("prevButton")
    .classList.toggle(
      "hidden",
      currentGroupIndex === 0
    );


  // 次へボタン
  document.getElementById("nextButton")
    .classList.toggle(
      "hidden",
      isLast
    );


  // 終了ボタン
  document.getElementById("finishButton")
    .classList.toggle(
      "hidden",
      !isLast
    );

}

/* =========================
   選択状況
========================= */

function updateStatus() {

  document.getElementById("status").textContent =
    `現在 ${selectedPeople.length}人選択中`;

}


/* =========================
   次のグループ
========================= */

document.getElementById("nextButton")
  .addEventListener("click", () => {

    currentGroupIndex++;

    showGroup();

  });


/* =========================
   前のグループ
========================= */

document.getElementById("prevButton")
  .addEventListener("click", () => {

    if (currentGroupIndex > 0) {

      currentGroupIndex--;

      showGroup();

    }

  });


/* =========================
   選考終了
========================= */

document.getElementById("finishButton")
  .addEventListener(
    "click",
    finishSelection
  );


function finishSelection() {

  if (selectedPeople.length === 0) {

    alert("1人以上選んでください！");
    return;

  }


  const result = selectedPeople;


  if (result.length === 9) {

    finalPeople = result;

    startFinal();

    return;

  }


  if (result.length > 9) {

    currentPeople = result;

    showRound();

    return;

  }


  if (result.length < 9) {

    alert(
      `現在${result.length}人です。\n9人以上になるように選んでください！`
    );

    currentPeople =
      currentPeople;

    showRound();

  }

}


/* =========================
   最終決戦開始
========================= */

function startFinal() {

  document.getElementById("selectionScreen")
    .classList.add("hidden");

  document.getElementById("finalScreen")
    .classList.remove("hidden");


  wins = {};


  finalPeople.forEach(person => {

    wins[person.id] = 0;

  });


  matchups = [];


  for (
    let i = 0;
    i < finalPeople.length;
    i++
  ) {

    for (
      let j = i + 1;
      j < finalPeople.length;
      j++
    ) {

      matchups.push([
        finalPeople[i],
        finalPeople[j]
      ]);

    }

  }


  currentMatchup = 0;

  showMatchup();

}


/* =========================
   対戦表示
========================= */

function showMatchup() {

  if (
    currentMatchup >= matchups.length
  ) {

    showRanking();

    return;

  }


  const [a, b] =
    matchups[currentMatchup];


  document.getElementById("progress")
    .textContent =
    `${currentMatchup + 1} / ${matchups.length}`;


  const container =
    document.getElementById("matchup");

  container.innerHTML = "";


  [a, b].forEach(person => {

    const card =
      document.createElement("div");

    card.className = "match-card";


    card.innerHTML = `
      <img src="${person.url}">
      <div class="match-name">
        ${person.name || "名前未登録"}
      </div>
    `;


    card.addEventListener("click", () => {

      wins[person.id]++;

      currentMatchup++;

      showMatchup();

    });


    container.appendChild(card);

  });

}


/* =========================
   ランキング
========================= */

function showRanking() {

  document.getElementById("finalScreen")
    .classList.add("hidden");

  document.getElementById("resultScreen")
    .classList.remove("hidden");


  const ranking =
    [...finalPeople]
      .sort(
        (a, b) =>
          wins[b.id] - wins[a.id]
      );


  const container =
    document.getElementById("ranking");

  container.innerHTML = "";


  /*
    表示順

    4位  5位  6位
    2位  1位  3位
    7位  8位  9位
  */

  const displayOrder = [

    ranking[3],
    ranking[4],
    ranking[5],

    ranking[1],
    ranking[0],
    ranking[2],

    ranking[6],
    ranking[7],
    ranking[8]

  ];


  displayOrder.forEach(person => {

    const index =
      ranking.indexOf(person);


    const item =
      document.createElement("div");

    item.className =
      "rank-item";


    /* 1位 */
    if (index === 0) {

      item.classList.add(
        "first-place"
      );

    }


    /* 2位 */
    if (index === 1) {

      item.classList.add(
        "second-place"
      );

    }


    /* 3位 */
    if (index === 2) {

      item.classList.add(
        "third-place"
      );

    }


    item.innerHTML = `

      <div class="rank-number">
        ${index + 1}位
      </div>

      <img src="${person.url}">

      <div class="rank-name">
        ${person.name || "名前未登録"}
      </div>

    `;


        container.appendChild(item);

  });


  // 結果画面を開いたときは順位表示ON
  let rankVisible = true;

  const toggleButton =
    document.getElementById("toggleRankButton");

  toggleButton.textContent = "順位を隠す";

  toggleButton.onclick = () => {

  rankVisible = !rankVisible;

  document.querySelectorAll(".rank-number")
    .forEach(rank => {

      rank.classList.toggle(
        "hidden",
        !rankVisible
      );

    });


  const rankingContainer =
    document.getElementById("ranking");

  const items =
    Array.from(
      document.querySelectorAll(".rank-item")
    );


  if (!rankVisible) {

    // 順位を隠す
    // → 9人をランダム配置

    items.sort(
      () => Math.random() - 0.5
    );

    items.forEach(item => {
      rankingContainer.appendChild(item);
    });


  } else {

    // 順位を表示
    // → 4 5 6
    //    2 1 3
    //    7 8 9
    // に戻す

    const order = [
      4, 5, 6,
      2, 1, 3,
      7, 8, 9
    ];


    order.forEach(rank => {

      const item =
        items.find(item => {

          const number =
            parseInt(
              item.querySelector(
                ".rank-number"
              ).textContent
            );

          return number === rank;

        });


      if (item) {
        rankingContainer.appendChild(item);
      }

    });

  }


  toggleButton.textContent =
    rankVisible
      ? "順位を隠す"
      : "順位を表示する";

};

}


/* =========================
   実行
========================= */

init();

</script>

</body>
</html>
