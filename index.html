<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>好き顔大阪9選</title>

<style>

body {
  font-family: sans-serif;
  background: #fff0f6;
  margin: 0;
  padding: 20px;
  color: #555;
}

h1 {
  text-align: center;
  color: #d86b9c;
  margin-bottom: 10px;
}

h2 {
  text-align: center;
  color: #d86b9c;
}

button {
  border: none;
  border-radius: 20px;
  padding: 10px 20px;
  background: #f3a6c7;
  color: white;
  font-size: 16px;
  cursor: pointer;

  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

button:hover {
  opacity: 0.8;
}


/* =========================
   スタート
========================= */

#start {
  display: block;
  margin: 30px auto;
}


/* =========================
   予選
========================= */

.group {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  max-width: 700px;
  margin: 20px auto;
}

.card {
  background: white;
  border-radius: 15px;
  padding: 8px;
  text-align: center;
  cursor: pointer;
  border: 3px solid transparent;
  transition: 0.2s;
}

.card.selected {
  border-color: #f08ab5;
  background: #fff4f8;
}

.card img {
  width: 100%;
  aspect-ratio: 1 / 1;
  object-fit: cover;
  border-radius: 12px;
  display: block;
}

.name {
  margin-top: 6px;
  font-size: 13px;
  line-height: 1.3;
  word-break: break-word;
}


/* =========================
   選択状況
========================= */

#status {
  text-align: center;
  margin: 10px;
  font-weight: bold;
}


/* =========================
   選択ボタン
========================= */

.selection-buttons {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  margin: 15px auto;
}


/* 選択を終了する */

#finishButton {
  display: block;

  min-height: 52px;
  padding: 12px 28px;

  margin: 15px auto;

  font-size: 17px;
  font-weight: bold;

  position: relative;
  z-index: 100;

  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}


/* 戻る・進む */

#prevButton,
#nextButton {
  min-height: 48px;
  padding: 10px 24px;

  margin: 10px 0;

  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}


/* =========================
   最終決戦
========================= */

.matchup {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px;
  max-width: 700px;
  margin: 30px auto;
}

.match-card {
  background: white;
  border-radius: 20px;
  padding: 10px;
  text-align: center;
  cursor: pointer;
}

.match-card:hover {
  opacity: 0.85;
}

.match-card img {
  width: 100%;
  aspect-ratio: 1 / 1;
  object-fit: cover;
  border-radius: 15px;
}

.match-name {
  font-size: 16px;
  margin-top: 8px;
  font-weight: bold;
}

#progress {
  text-align: center;
  margin: 15px;
  color: #d86b9c;
  font-weight: bold;
}


/* =========================
   結果
========================= */

.rank {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  max-width: 700px;
  margin: auto;
  padding: 10px;
}

.rank-item {
  background: white;
  padding: 8px;
  border-radius: 15px;
  text-align: center;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.rank-item img {
  width: 100%;
  aspect-ratio: 1 / 1;
  object-fit: cover;
  border-radius: 12px;
  display: block;
  margin-bottom: 6px;
}

.rank-number {
  font-size: 20px;
  font-weight: bold;
  margin-bottom: 4px;
  color: #d86b9c;
}


/* 1位 */

.rank-item.first-place .rank-number {
  color: #d4a017;
  font-size: 24px;
  text-shadow: 0 1px 2px rgba(0,0,0,0.1);
}


/* 2位 */

.rank-item.second-place .rank-number {
  color: #9fa4aa;
  font-size: 22px;
  text-shadow: 0 1px 2px rgba(0,0,0,0.1);
}


/* 3位 */

.rank-item.third-place .rank-number {
  color: #b87333;
  font-size: 22px;
  text-shadow: 0 1px 2px rgba(0,0,0,0.1);
}

.rank-name {
  font-size: 13px;
  line-height: 1.3;
  word-break: break-word;
}


/* =========================
   共通
========================= */

.hidden {
  display: none !important;
}

.rank-empty {
  visibility: hidden;
}


/* =========================
   人数ごとのランキング配置
========================= */


/* 1人 */

.rank.rank-1 {
  grid-template-columns: repeat(3, 1fr);
  max-width: 300px;
}


/* 2人 */

.rank.rank-2 {
  grid-template-columns: repeat(2, 1fr);
  max-width: 500px;
}


/* 3人 */

.rank.rank-3 {
  grid-template-columns: repeat(3, 1fr);
}


/* 4人・6人 */

.rank.rank-4,
.rank.rank-6 {
  grid-template-columns: repeat(2, 1fr);
  max-width: 500px;
}


/* 5人・7人・8人・9人 */

.rank.rank-5,
.rank.rank-7,
.rank.rank-8,
.rank.rank-9 {
  grid-template-columns: repeat(3, 1fr);
}


/* =========================
   確認ポップアップ
========================= */

.confirm-modal {
  position: fixed;
  inset: 0;

  z-index: 99999;

  display: flex;
  align-items: center;
  justify-content: center;

  background: rgba(0, 0, 0, 0.4);

  padding: 20px;
  box-sizing: border-box;
}

.confirm-box {
  width: min(90%, 360px);

  background: white;

  border-radius: 20px;

  padding: 25px 20px;

  text-align: center;

  box-sizing: border-box;

  box-shadow: 0 5px 25px rgba(0,0,0,0.2);
}

.confirm-box p {
  margin: 0 0 20px;

  font-size: 17px;
  line-height: 1.6;
}

.confirm-buttons {
  display: flex;
  justify-content: center;
  gap: 12px;
}

.confirm-buttons button {
  min-width: 100px;
  min-height: 48px;

  border-radius: 25px;

  background: #f19ac5;

  color: white;

  font-size: 16px;

  padding: 10px 18px;
}


/* =========================
   スマホ
========================= */

@media (max-width: 500px) {

  body {
    padding: 10px;
  }

  .group {
    gap: 7px;
  }

  .name,
  .rank-name {
    font-size: 11px;
  }

  .rank-number {
    font-size: 17px;
  }

  .rank-item.first-place .rank-number {
    font-size: 21px;
  }

  .rank-item.second-place .rank-number,
  .rank-item.third-place .rank-number {
    font-size: 19px;
  }

}

</style>

</head>


<body>


<h1>💗 好き顔大阪9選 💗</h1>


<!-- =========================
     読み込み
========================= -->

<div id="loading">

  <p style="text-align:center;">
    読み込み中…
  </p>

</div>


<!-- =========================
     スタート画面
========================= -->

<div id="startScreen" class="hidden">

  <p style="text-align:center;">
    好きな人を選んでください♡
  </p>

  <button id="start">
    スタート
  </button>

</div>


<!-- =========================
     選択画面
========================= -->

<div id="selectionScreen" class="hidden">

  <h2 id="roundTitle"></h2>

  <div id="status"></div>


  <!--
    ここは予選の全ページで常に表示
  -->

  <button id="finishButton">
    選択を終了する
  </button>


  <div id="groups"></div>


  <!-- ページ移動 -->

  <div class="selection-buttons">

    <button id="prevButton" class="hidden">
      戻る
    </button>

    <button id="nextButton">
      進む
    </button>

  </div>

</div>


<!-- =========================
     確認ポップアップ
========================= -->

<div id="confirmModal" class="confirm-modal hidden">

  <div class="confirm-box">

    <p id="confirmText"></p>

    <div class="confirm-buttons">

      <button id="confirmProceedButton">
        進む
      </button>

      <button id="confirmCancelButton">
        戻る
      </button>

    </div>

  </div>

</div>


<!-- =========================
     最終決戦
========================= -->

<div id="finalScreen" class="hidden">

  <h2>💗 最終決戦 💗</h2>

  <div id="progress"></div>

  <div id="matchup" class="matchup"></div>

</div>


<!-- =========================
     結果
========================= -->

<div id="resultScreen" class="hidden">

  <h2>
    🏆 あなたのタイプのお顔大阪 🏆
  </h2>


  <button
    id="toggleRankButton"
    style="display:block;margin:15px auto;"
  >
    順位を隠す
  </button>


  <div id="ranking" class="rank"></div>


  <button
    onclick="location.reload()"
    style="display:block;margin:25px auto;"
  >
    もう一度やる
  </button>


  <p
    style="
      text-align:center;
      margin-top:35px;
      font-size:13px;
      color:#888;
    "
  >
    ※アイドルさんの悲しむポストはお控えください
  </p>

</div>


<script>


/* =========================
   GitHub設定
========================= */

const OWNER = "cohasuki";
const REPO = "sukigao_osaka";


/* =========================
   データ
========================= */

let names = {};
let people = [];

let currentPeople = [];
let selectedPeople = [];

let groups = [];
let currentGroupIndex = 0;

let groupSelections = [];

let finalPeople = [];
let matchups = [];
let currentMatchup = 0;

let wins = {};


/* =========================
   名前データ読み込み
========================= */

async function loadNames() {

  const url =
    `https://${OWNER}.github.io/${REPO}/names.js?v=${Date.now()}`;

  const response =
    await fetch(url, {
      cache: "no-store"
    });

  const text =
    await response.text();

  const match =
    text.match(
      /const\s+names\s*=\s*(\{[\s\S]*?\});/
    );

  if (!match) {

    throw new Error(
      "names.jsの読み込みに失敗しました"
    );

  }

  names =
    Function(
      `"use strict"; return (${match[1]});`
    )();

}


/* =========================
   写真読み込み
========================= */

async function loadPhotos() {

  const url =
    `https://api.github.com/repos/${OWNER}/${REPO}/contents/?v=${Date.now()}`;

  const response =
    await fetch(url, {
      cache: "no-store"
    });

  if (!response.ok) {

    throw new Error(
      "GitHubから写真を取得できませんでした"
    );

  }

  const files =
    await response.json();


  people =
    files

      .filter(file =>
        /\.(jpg|jpeg|png|webp)$/i.test(
          file.name
        )
      )

      .sort((a, b) =>
        a.name.localeCompare(b.name)
      )

      .map((file, index) => ({

        id: index,

        filename: file.name,

        url: file.download_url,

        name:
          names[file.name] || ""

      }));

}


/* =========================
   初期化
========================= */

async function init() {

  try {

    await loadNames();

    await loadPhotos();


    document
      .getElementById("loading")
      .classList.add("hidden");


    document
      .getElementById("startScreen")
      .classList.remove("hidden");


  } catch (error) {

    console.error(error);


    document
      .getElementById("loading")
      .innerHTML =

      `<p style="text-align:center;color:red;">
        読み込みに失敗しました。<br>
        少し時間を置いて再読み込みしてください。
      </p>`;

  }

}


/* =========================
   スタート
========================= */

document
  .getElementById("start")
  .addEventListener(
    "click",
    startSelection
  );


function startSelection() {

  currentPeople =
    [...people].sort(
      () =>
        Math.random() - 0.5
    );


  selectedPeople = [];

  groupSelections = [];


  document
    .getElementById("startScreen")
    .classList.add("hidden");


  document
    .getElementById("selectionScreen")
    .classList.remove("hidden");


  showRound();

}


/* =========================
   予選ラウンド開始
========================= */

function showRound() {

  selectedPeople = [];

  currentGroupIndex = 0;

  groups = [];

  groupSelections = [];


  for (
    let i = 0;
    i < currentPeople.length;
    i += 9
  ) {

    groups.push(
      currentPeople.slice(
        i,
        i + 9
      )
    );

  }


  document
    .getElementById("roundTitle")
    .textContent =
      `${currentPeople.length}人から選ぶ`;


  showGroup();

}


/* =========================
   グループ表示
========================= */

function showGroup() {

  const container =
    document.getElementById(
      "groups"
    );


  container.innerHTML = "";


  const group =
    groups[currentGroupIndex];


  const groupDiv =
    document.createElement(
      "div"
    );


  groupDiv.className =
    "group";


  const savedSelections =
    groupSelections[
      currentGroupIndex
    ] || [];


  group.forEach(
    person => {

      const card =
        document.createElement(
          "div"
        );


      card.className =
        "card";


      if (
        savedSelections.includes(
          person
        )
      ) {

        card.classList.add(
          "selected"
        );

      }


      card.innerHTML = `

        <img src="${person.url}">

        <div class="name">
          ${person.name || "名前未登録"}
        </div>

      `;


      card.addEventListener(
        "click",
        () => {

          if (
            selectedPeople.includes(
              person
            )
          ) {

            selectedPeople =
              selectedPeople.filter(
                p => p !== person
              );


            card.classList.remove(
              "selected"
            );

          } else {

            selectedPeople.push(
              person
            );


            card.classList.add(
              "selected"
            );

          }


          groupSelections[
            currentGroupIndex
          ] =
            selectedPeople.filter(
              p => group.includes(p)
            );


          updateStatus();

        }
      );


      groupDiv.appendChild(
        card
      );

    }
  );


  container.appendChild(
    groupDiv
  );


  /* =========================
     選択状態を復元
  ========================= */

  selectedPeople = [

    ...selectedPeople.filter(
      p => !group.includes(p)
    ),

    ...savedSelections

  ];


  updateStatus();


  /* =========================
     ページ移動ボタン
  ========================= */

  const isFirst =
    currentGroupIndex === 0;


  const isLast =
    currentGroupIndex ===
    groups.length - 1;


  /* 戻る */

  document
    .getElementById("prevButton")
    .classList.toggle(
      "hidden",
      isFirst
    );


  /* 進む */

  document
    .getElementById("nextButton")
    .classList.toggle(
      "hidden",
      isLast
    );


  /*
    選択終了ボタンは
    ここでは一切hiddenにしない。

    予選の全ページで常に表示。
  */

}


/* =========================
   選択状況
========================= */

function updateStatus() {

  document
    .getElementById("status")
    .textContent =
      `現在 ${selectedPeople.length}人選択中`;

}


/* =========================
   進む
========================= */

document
  .getElementById("nextButton")
  .addEventListener(
    "click",
    () => {

      if (
        currentGroupIndex <
        groups.length - 1
      ) {

        currentGroupIndex++;

        showGroup();

        window.scrollTo({
          top: 0,
          behavior: "smooth"
        });

      }

    }
  );


/* =========================
   戻る
========================= */

document
  .getElementById("prevButton")
  .addEventListener(
    "click",
    () => {

      if (
        currentGroupIndex > 0
      ) {

        currentGroupIndex--;

        showGroup();

        window.scrollTo({
          top: 0,
          behavior: "smooth"
        });

      }

    }
  );


/* =========================
   選択終了
========================= */

document
  .getElementById("finishButton")
  .addEventListener(
    "click",
    finishSelection
  );


function finishSelection() {

  if (
    selectedPeople.length === 0
  ) {

    showConfirmModal(
      "1人以上選んでください！",
      false
    );

    return;

  }


  const result =
    [...selectedPeople];


  /* =========================
     9人ちょうど
  ========================= */

  if (
    result.length === 9
  ) {

    finalPeople =
      result;

    startFinal();

    return;

  }


  /* =========================
     10人以上
  ========================= */

  if (
    result.length > 9
  ) {

    currentPeople =
      result;

    showRound();

    return;

  }


  /* =========================
     1〜8人
  ========================= */

  if (
    result.length < 9
  ) {

    showConfirmModal(
      `${result.length}人選択中です。9人未満ですが次に進んでよろしいですか？`,
      true
    );

    return;

  }

}


/* =========================
   確認ポップアップ
========================= */

function showConfirmModal(
  message,
  canProceed
) {

  const modal =
    document.getElementById(
      "confirmModal"
    );


  const text =
    document.getElementById(
      "confirmText"
    );


  const proceedButton =
    document.getElementById(
      "confirmProceedButton"
    );


  const cancelButton =
    document.getElementById(
      "confirmCancelButton"
    );


  text.textContent =
    message;


  if (canProceed) {

    proceedButton
      .classList.remove(
        "hidden"
      );

    cancelButton.textContent =
      "戻る";

  } else {

    proceedButton
      .classList.add(
        "hidden"
      );

    cancelButton.textContent =
      "OK";

  }


  modal.classList.remove(
    "hidden"
  );

}


/* =========================
   確認 → 進む
========================= */

document
  .getElementById(
    "confirmProceedButton"
  )
  .addEventListener(
    "click",
    () => {

      finalPeople =
        [...selectedPeople];


      document
        .getElementById(
          "confirmModal"
        )
        .classList.add(
          "hidden"
        );


      startFinal();

    }
  );


/* =========================
   確認 → 戻る
========================= */

document
  .getElementById(
    "confirmCancelButton"
  )
  .addEventListener(
    "click",
    () => {

      document
        .getElementById(
          "confirmModal"
        )
        .classList.add(
          "hidden"
        );

    }
  );


/* =========================
   最終決戦開始
========================= */

function startFinal() {

  document
    .getElementById(
      "selectionScreen"
    )
    .classList.add(
      "hidden"
    );


  document
    .getElementById(
      "finalScreen"
    )
    .classList.remove(
      "hidden"
    );


  wins = {};


  finalPeople.forEach(
    person => {

      wins[person.id] = 0;

    }
  );


  matchups = [];


  for (
    let i = 0;
    i < finalPeople.length;
    i++
  ) {

    for (
      let j = i + 1;
      j < finalPeople.length;
      j++
    ) {

      matchups.push([
        finalPeople[i],
        finalPeople[j]
      ]);

    }

  }


  currentMatchup = 0;


  showMatchup();

}


/* =========================
   対戦表示
========================= */

function showMatchup() {

  if (
    currentMatchup >=
    matchups.length
  ) {

    showRanking();

    return;

  }


  const [a, b] =
    matchups[
      currentMatchup
    ];


  document
    .getElementById(
      "progress"
    )
    .textContent =
      `${currentMatchup + 1} / ${matchups.length}`;


  const container =
    document.getElementById(
      "matchup"
    );


  container.innerHTML = "";


  [a, b].forEach(
    person => {

      const card =
        document.createElement(
          "div"
        );


      card.className =
        "match-card";


      card.innerHTML = `

        <img src="${person.url}">

        <div class="match-name">
          ${person.name || "名前未登録"}
        </div>

      `;


      card.addEventListener(
        "click",
        () => {

          wins[person.id]++;

          currentMatchup++;

          showMatchup();

        }
      );


      container.appendChild(
        card
      );

    }
  );

}


/* =========================
   ランキング
========================= */

function showRanking() {

  document
    .getElementById(
      "finalScreen"
    )
    .classList.add(
      "hidden"
    );


  document
    .getElementById(
      "resultScreen"
    )
    .classList.remove(
      "hidden"
    );


  const ranking =
    [...finalPeople]
      .sort(
        (a, b) =>
          wins[b.id] -
          wins[a.id]
      );


  const container =
    document.getElementById(
      "ranking"
    );


  container.innerHTML = "";


  container.className =
    "rank";


  container.classList.add(
    `rank-${ranking.length}`
  );


  /* =========================
     人数ごとの配置
  ========================= */

  const layouts = {

    1: [
      null, 1, null
    ],

    2: [
      1, 2
    ],

    3: [
      2, 1, 3
    ],

    4: [
      1, 2,
      3, 4
    ],

    5: [
      null, 2, 3,
      null, 1, null,
      null, 4, 5
    ],

    6: [
      3, 4,
      1, 2,
      5, 6
    ],

    7: [
      null, 4, 5,
      2, 1, 3,
      null, 6, 7
    ],

    8: [
      3, 4, 5,
      null, 1, 2,
      6, 7, 8
    ],

    9: [
      4, 5, 6,
      2, 1, 3,
      7, 8, 9
    ]

  };


  const layout =
    layouts[
      ranking.length
    ];


  /* =========================
     ランキング生成
  ========================= */

  layout.forEach(
    rank => {

      if (
        rank === null
      ) {

        const empty =
          document.createElement(
            "div"
          );


        empty.className =
          "rank-empty";


        container.appendChild(
          empty
        );


        return;

      }


      const person =
        ranking[
          rank - 1
        ];


      const item =
        document.createElement(
          "div"
        );


      item.className =
        "rank-item";


      if (
        rank === 1
      ) {

        item.classList.add(
          "first-place"
        );

      }


      if (
        rank === 2
      ) {

        item.classList.add(
          "second-place"
        );

      }


      if (
        rank === 3
      ) {

        item.classList.add(
          "third-place"
        );

      }


      item.innerHTML = `

        <div class="rank-number">
          ${rank}位
        </div>

        <img src="${person.url}">

        <div class="rank-name">
          ${person.name || "名前未登録"}
        </div>

      `;


      container.appendChild(
        item
      );

    }
  );


  /* =========================
     順位表示切り替え
  ========================= */

  let rankVisible = true;


  const toggleButton =
    document.getElementById(
      "toggleRankButton"
    );


  toggleButton.textContent =
    "順位を隠す";


  toggleButton.onclick =
    () => {

      rankVisible =
        !rankVisible;


      const rankingContainer =
        document.getElementById(
          "ranking"
        );


      const items =
        Array.from(
          document.querySelectorAll(
            ".rank-item"
          )
        );


      /* 順位を隠す */

      if (
        !rankVisible
      ) {

        document
          .querySelectorAll(
            ".rank-number"
          )
          .forEach(
            rank => {

              rank.classList.add(
                "hidden"
              );

            }
          );


        items.sort(
          () =>
            Math.random() -
            0.5
        );


        rankingContainer.innerHTML =
          "";


        items.forEach(
          item => {

            rankingContainer
              .appendChild(
                item
              );

          }
        );

      }


      /* 順位を表示 */

      else {

        rankingContainer.innerHTML =
          "";


        layout.forEach(
          rank => {

            if (
              rank === null
            ) {

              const empty =
                document.createElement(
                  "div"
                );


              empty.className =
                "rank-empty";


              rankingContainer
                .appendChild(
                  empty
                );


              return;

            }


            const item =
              items.find(
                item => {

                  const number =
                    parseInt(
                      item
                        .querySelector(
                          ".rank-number"
                        )
                        .textContent
                    );


                  return (
                    number === rank
                  );

                }
              );


            if (item) {

              item
                .querySelector(
                  ".rank-number"
                )
                .classList.remove(
                  "hidden"
                );


              rankingContainer
                .appendChild(
                  item
                );

            }

          }
        );

      }


      toggleButton.textContent =
        rankVisible
          ? "順位を隠す"
          : "順位を表示する";

    };

}


/* =========================
   実行
========================= */

init();

</script>

</body>
</html>
